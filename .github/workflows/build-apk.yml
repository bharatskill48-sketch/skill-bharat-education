
name: Build SKILL BHARAT EDUCATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/skillbharat/education
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi

          test -f favicon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "SkillBharatEducation"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.skillbharat.education'
            compileSdk 35

            defaultConfig {
              applicationId 'com.skillbharat.education'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          convert favicon.png -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:colorAccent">#D9A52B</item>
              <item name="android:statusBarColor">#073B78</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="SKILL BHARAT EDUCATION"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/skillbharat/education/MainActivity.java <<'EOF'
          package com.skillbharat.education;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              WebView web = new WebView(this);
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient());
              setContentView(web);

              web.loadUrl("https://bharatskill48-sketch.github.io/skill-bharat-education/");
            }

            @Override
            public void onBackPressed() {
              WebView web = (WebView) findViewById(android.R.id.content).getRootView();
              super.onBackPressed();
            }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKILL-BHARAT-EDUCATION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
